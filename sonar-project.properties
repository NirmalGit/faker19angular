sonar.projectKey=faker19angular
sonar.projectName=Faker 19 Angular
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Security: Use an environment variable instead of hardcoding the token
# sonar.token is passed via CLI or environment variable

# Specify source files
sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/*.module.ts,**/node_modules/**,**/dist/**

# Optional: Set language explicitly
sonar.language=TypeScript

# Optional: Improve reporting
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Optional: Improve analysis speed
sonar.scm.disabled=true
sonar.cpd.exclusions=**/*.spec.ts,**/*.module.ts,**/node_modules/**,**/dist/**