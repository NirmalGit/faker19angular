<!-- Nav with Cart and User Profile -->
<div class="bg-blue-600 text-white p-4 sticky top-0 z-50">
  <div class="container mx-auto flex justify-between items-center">
    <h1 class="text-2xl font-bold">FakeStore</h1>
    <div class="flex items-center gap-4">
      <!-- User Profile -->
      @if (currentUser) {
        <div class="flex items-center gap-2">
          <img [src]="currentUser.photoUrl" alt="User profile" class="w-8 h-8 rounded-full">
          <span>{{ currentUser.name }}</span>
          <button 
            class="ml-2 bg-red-500 px-3 py-1 rounded hover:bg-red-600 transition-colors text-sm"
            (click)="logout()">
            Logout
          </button>
        </div>
      }
      <!-- Cart Button (Only shown when authenticated) -->
      @if (currentUser) {
        <button 
          class="flex items-center gap-2 bg-blue-500 px-4 py-2 rounded-full hover:bg-blue-700 transition-colors"
          (click)="toggleCart()">
          <span class="material-icons">shopping_cart</span>
          <span class="font-bold">{{ cartCount() }}</span>
          <span>${{ cartTotal().toFixed(2) }}</span>
        </button>
      }
    </div>
  </div>
</div>

<router-outlet />
