<div class="login-container">
  <div class="login-card">
    <h2>Login to your account</h2>
    <p>Sign in with your Google account to continue</p>
    
    <div class="google-btn-container">
      <!-- Google Sign-In Button will be rendered here by the Google Identity Services API -->
      <div id="googleSignInButton"></div>
    </div>
    
    <div class="login-note">
      <p>Note: To use this feature, replace the clientId in login.component.ts with your own Google Client ID.</p>
      <p>You can create one at the <a href="https://console.cloud.google.com/" target="_blank">Google Cloud Console</a>.</p>
    </div>
  </div>
</div>
